<script>
/* ===== Ponte local: roda a mesma tela no seu computador, com DataJud direto ===== */
(() => {
  const j = async (url, opts) => { const r = await fetch(url, opts); const b = await r.json().catch(() => ({})); if (!r.ok) throw Object.assign(new Error(b.error || `Erro ${r.status}`), { code: b.code }); return b; };
  const enc = encodeURIComponent;
  const doc = (p) => ({
    id: p.split("/").pop(), path: p,
    async get() { const b = await j(`/api/kv/doc?path=${enc(p)}`); return { id: p.split("/").pop(), exists: b.exists, data: () => b.data, metadata: {} }; },
    async set(d) { await j(`/api/kv/doc?path=${enc(p)}`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(d) }); },
    async update(d) { const s = await this.get(); await this.set(Object.assign({}, s.exists ? s.data() : {}, d)); },
    async delete() { await j(`/api/kv/doc?path=${enc(p)}`, { method: "DELETE" }); },
  });
  const collection = (p) => {
    const q = { _o: null, _d: "asc", _l: 100000 };
    Object.assign(q, {
      orderBy(f, d) { q._o = f; q._d = d || "asc"; return q; }, limit(n) { q._l = n; return q; }, where() { return q; },
      doc: (id) => doc(`${p}/${id || Date.now().toString(36) + Math.random().toString(36).slice(2, 8)}`),
      async add(d) { const r = doc(`${p}/${Date.now().toString(36)}${Math.random().toString(36).slice(2, 8)}`); await r.set(d); return r; },
      async get() {
        const b = await j(`/api/kv/col?path=${enc(p)}`);
        let docs = b.docs.map((x) => ({ id: x.id, exists: true, data: () => x.data, metadata: {} }));
        if (q._o) docs.sort((a, c) => ((a.data()[q._o] < c.data()[q._o]) ? -1 : 1) * (q._d === "desc" ? -1 : 1));
        docs = docs.slice(0, q._l);
        return { docs, size: docs.length, empty: !docs.length };
      },
    });
    return q;
  };
  const db = { doc, collection };
  let meta = null;
  const user = { me: async () => { meta = meta || (await j("/api/lit/meta")); return { id: "local:" + meta.user, name: meta.user }; }, profiles: async () => ({}) };
  const downloads = {
    async save({ filename, data }) {
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data])); a.download = filename;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      return { status: "saved" };
    },
  };
  const mcp = {
    async callTool(server, tool, input) {
      if (server !== "host:datajud" || tool !== "consultar_processos") throw Object.assign(new Error("Ferramenta indisponível."), { code: "not_in_manifest" });
      const payload = await j("/api/lit/datajud-batch", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(input) });
      return { content: [], payload };
    },
  };
  window.claude = { use: async (n) => ({ db, user, downloads, mcp })[n] || null };
  window.__LOCAL__ = true;
})();

</script>

<script>
/* ===== Litigation Audit Engine v0.1 : AUD-001..AUD-026 ===== */
const ENGINE_VERSION = '0.1';
const SEV = { C: 'Critical', R: 'Relevant', Q: 'Quality' };

const RULES = [
  { id:'AUD-001', sev:'C', block:true,  name:'Número CNJ inválido', src:['Excel','Word'],
    se:'Número não tem 20 dígitos ou o dígito verificador (módulo 97, Res. CNJ 65/2008) não confere.',
    entao:'Sinaliza o registro; não entra em nenhum cruzamento até ser corrigido.',
    evid:'Número recebido, dígito calculado × informado.', acoes:['MANUAL','JUSTIFIED'] },
  { id:'AUD-002', sev:'C', block:true,  name:'Processo duplicado', src:['Excel','Word'],
    se:'O mesmo CNJ normalizado aparece em mais de uma linha do Excel ou em mais de um bloco do Word.',
    entao:'Sinaliza todas as ocorrências; a população reportável não fecha até restar uma.',
    evid:'Linhas/blocos em que o CNJ se repete.', acoes:['MANUAL','JUSTIFIED'] },
  { id:'AUD-003', sev:'R', block:false, name:'CNJ × Plaintiff divergente', src:['Excel','Word'],
    se:'Para o mesmo CNJ, o autor no Excel e o Plaintiff no Word têm similaridade de nome < 60%.',
    entao:'Sinaliza possível troca de processo entre registros.',
    evid:'Nome Excel × nome Word, % de similaridade.', acoes:['ACCEPT','KEEP','MANUAL'] },
  { id:'AUD-004', sev:'R', block:false, name:'CNJ × Defendant divergente', src:['Excel','Word'],
    se:'Empresa do Excel (Crop/Seeds) diverge da Defendant do Word.',
    entao:'Sinaliza para confirmar a entidade ré reportada.',
    evid:'Empresa Excel × Defendant Word.', acoes:['ACCEPT','KEEP','MANUAL'] },
  { id:'AUD-005', sev:'R', block:false, name:'Ano CNJ × Filing Date incompatível', src:['Word','Excel'],
    se:'Date of First Court Filing (Word) ≠ ano do CNJ, ou data de distribuição (Excel) em ano diferente do CNJ.',

const RULE = Object.fromEntries(RULES.map(r => [r.id, r]));

/* ---------- helpers ---------- */
const normCnj = s => { const d = String(s ?? '').replace(/\D/g, ''); return d || null; };
const fmtCnj = d => d && d.length === 20 ? `${d.slice(0,7)}-${d.slice(7,9)}.${d.slice(9,13)}.${d[13]}.${d.slice(14,16)}.${d.slice(16)}` : (d || '—');
function cnjValid(d) {
  if (!d || d.length !== 20) return { ok:false, why:`${d ? d.length : 0} dígitos (esperado 20)` };
  const n = BigInt(d.slice(0,7) + d.slice(9,13) + d[13] + d.slice(14,16) + d.slice(16) + '00');
  const dv = 98n - (n % 97n);
  const calc = String(dv).padStart(2,'0');
  return calc === d.slice(7,9) ? { ok:true } : { ok:false, why:`DV informado ${d.slice(7,9)}, calculado ${calc}` };
}
const strip = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
function nameSim(a, b) {
  const A = new Set(strip(a).split(' ').filter(w => w.length > 2 && !['dos','das','de','da','do'].includes(w)));
  const B = new Set(strip(b).split(' ').filter(w => w.length > 2 && !['dos','das','de','da','do'].includes(w)));
  if (!A.size || !B.size) return 1;
  let i = 0; A.forEach(w => { if (B.has(w)) i++; });
  return i / Math.min(A.size, B.size);
}
const num = x => (x === null || x === undefined || x === '' || isNaN(+x)) ? null : +x;
const pct = (a, b) => (a && b) ? (b - a) / Math.abs(a) : null;

function stageFromExcel(p) {
  const s = strip(p);
  if (!s) return null;
  if (s.startsWith('1')) return 'PENDING';
  if (s.startsWith('2') || s.startsWith('3') || s.includes('recursal')) return 'APPEAL';
  if (s.includes('execu')) return 'ENFORCEMENT';
  if (s.includes('acordo')) return 'SETTLEMENT';
  if (s.includes('arquiv')) return 'COMPLETED';
  if (s.includes('administ')) return 'PENDING';
  return null;
}
function stageFromWord(t) {
  const s = strip(t);
  if (!s) return null;
  if (s.includes('complet')) return 'COMPLETED';
  if (s.includes('appeal')) return 'APPEAL';
  if (s.includes('enforce') || s.includes('execution')) return 'ENFORCEMENT';
  if (s.includes('settle')) return 'SETTLEMENT';
  if (s.includes('pending') || s.includes('court') || s.includes('cort')) return 'PENDING';
  return 'OTHER';
}
const STAGE_LABEL = { PENDING:'Action Pending in Court', APPEAL:'On Appeal', ENFORCEMENT:'Enforcement', SETTLEMENT:'Negotiated Settlement', COMPLETED:'Completed', OTHER:'(não padronizado)' };
const RELEVANT = { transito:'Trânsito em julgado', baixa:'Baixa/Arquivamento', acordo:'Acordo', pagamento:'Pagamento/Levantamento', calculos:'Homologação/Liquidação', execucao:'Execução', acordao:'Acórdão', sentenca:'Sentença/Julgamento', recurso:'Recurso' };

function quarterInfo(cid) { // 'Q3-2026'
  const m = /Q(\d)-(\d{4})/.exec(cid || ''); if (!m) return null;
  const q = +m[1], y = +m[2];
  const endM = q * 3, start = `${y}-${String(endM - 2).padStart(2,'0')}-01`;
  const end = new Date(Date.UTC(y, endM, 0)).toISOString().slice(0,10);
  const prevEnd = new Date(Date.UTC(y, endM - 3, 0)).toISOString().slice(0,10);
  return { q, y, start, end, prevEnd, prevId: q === 1 ? `Q4-${y-1}` : `Q${q-1}-${y}` };
}
function lastUpdateEnd(s) { // "2nd Quarter 2026"
  const m = /(\d)\s*(st|nd|rd|th)?\s*quarter\s*(\d{4})/i.exec(s || ''); if (!m) return null;
  const q = +m[1], y = +m[3];
  return new Date(Date.UTC(y, q * 3, 0)).toISOString().slice(0,10);
}

/* DataJud: summary of one CNJ = array of instances (one per grau/tribunal) */
function djSummary(inst) {
  if (!inst || !inst.length) return null;
  const all = [];
  inst.forEach(i => (i.rel || []).forEach(r => all.push({ ...r, grau: i.grau, trib: i.trib })));
  all.sort((a, b) => a.d < b.d ? -1 : 1);
  const lastAny = inst.map(i => i.last && { ...i.last, grau: i.grau }).filter(Boolean).sort((a, b) => a.d < b.d ? -1 : 1).pop() || null;
  const flags = {}; inst.forEach(i => Object.entries(i.flags || {}).forEach(([k, d]) => { if (!flags[k] || flags[k] < d) flags[k] = d; }));
  const graus = [...new Set(inst.map(i => i.grau))];
  const lastByGrau = {}; inst.forEach(i => { if (i.last && (!lastByGrau[i.grau] || lastByGrau[i.grau] < i.last.d)) lastByGrau[i.grau] = i.last.d; });
  const lastRel = all[all.length - 1] || null;
  const minAjuiz = inst.map(i => i.ajuiz).filter(Boolean).sort()[0] || null;
  return { graus, lastAny, lastRel, rel: all, flags, lastByGrau, ajuiz: minAjuiz };
}
function djStage(s) {
  if (!s) return null;
  const f = s.flags, last = s.lastAny?.d || '';
  if (f.baixa && f.baixa >= last.slice(0,10) && !['G2','SUP','GS'].some(g => (s.lastByGrau[g] || '') > f.baixa)) return 'COMPLETED';
  if (f.execucao || f.calculos) {
    const e = [f.execucao, f.calculos].filter(Boolean).sort().pop();
    if (!f.baixa || e > f.baixa) return 'ENFORCEMENT';
  }
  const g1 = s.lastByGrau.G1 || '', g2 = s.lastByGrau.G2 || '', sup = s.lastByGrau.SUP || s.lastByGrau.GS || '';
  if ((g2 || sup) && (g2 > g1 || sup > g1)) return 'APPEAL';
  return 'PENDING';
}


/* Frase em inglês para o Status Update a partir dos andamentos relevantes do DataJud */
const COURT = { G1: 'the Labor Court', G2: 'the Regional Labor Court', SUP: 'the Superior Labor Court (TST)', GS: 'the Superior Labor Court (TST)' };
const PHRASE = {
  sentenca: (c) => `${c} issued a judgment`,
  acordao: (c) => `${c} ruled on the appeal`,
  recurso: (c) => `an appeal was filed before ${c}`,
  transito: () => 'the decision became final and binding',
  execucao: () => 'the enforcement phase began',
  calculos: () => 'the enforcement calculations were addressed by the court',
  pagamento: () => 'a payment or release of funds was recorded',
  acordo: () => 'a settlement was recorded in the case',
  baixa: () => 'the case was archived',
};
function statusSentence(evs) {
  const seen = new Set(), out = [];
  for (const e of evs) {
    const k = e.c + e.d; if (seen.has(k)) continue; seen.add(k);
    const [y, m, d] = e.d.split('-');
    const court = COURT[e.grau] || 'the court';
    const txt = (PHRASE[e.c] || (() => e.n))(court);
    out.push(`On ${m}/${d}/${y}, ${txt}.`);
  }
  return out.slice(-4).join(' ');
}

/* ---------- main ---------- */
function runAudit(ctx) {
  // ctx: {cycleId, params:{threshold, fx, materiality, fxTol}, excel:[], word:[], dj:{cnj:[inst]}, baseline:{cnj:row}|null, baselineClosed:Set, docxRev:{cnj:n}|null}
  const P = Object.assign({ threshold: 125000, fx: 5.70, materiality: 0.20, fxTol: 0.01, wordScope: ['Crop'] }, ctx.params || {});
  const Q = quarterInfo(ctx.cycleId);
  const issues = [];
  const add = (rid, cnj, o) => issues.push(Object.assign({ key: `${rid}_${cnj || o.ref || 'x'}${o.suffix ? '_' + o.suffix : ''}`, rule: rid, sev: RULE[rid].sev, block: RULE[rid].block, cnj }, o));

  const ex = ctx.excel || [], wd = ctx.word || [];
  const exBy = {}; ex.forEach((r, i) => { r._i = i; (exBy[r.cnj] = exBy[r.cnj] || []).push(r); });
  const wdGen = wd.filter(w => w.kind === 'general'), wdClosed = wd.filter(w => w.kind === 'closed');
  const wdBy = {}; wdGen.forEach(w => { (wdBy[w.cnj] = wdBy[w.cnj] || []).push(w); });
  const closedBy = {}; wdClosed.forEach(w => { closedBy[w.cnj] = w; });
  const base = ctx.baseline || null;

  // population = reportable now or before, or present in any Word
  const inPop = r => r.repCur === 'Sim' || r.repPrev === 'Sim' || (r.litCur && r.litCur !== 'NÃO ENTRA');
  const pop = new Set();
  ex.forEach(r => { if (inPop(r)) pop.add(r.cnj); });
  wd.forEach(w => w.cnj && pop.add(w.cnj));

  const scope = new Set(P.wordScope || ['Crop']);
  const inScope = r => scope.has(r.empresa);
  const plaintiffOf = c => (exBy[c]?.[0]?.autor) || (wdBy[c]?.[0]?.plaintiff) || (closedBy[c]?.plaintiff) || '';

  // AUD-001 (all Excel rows + Word)
  ex.forEach(r => { const v = cnjValid(r.cnj); if (!v.ok) add('AUD-001', r.cnj, { ref: 'ex' + r._i, field: 'Lawsuit Number', excel: r.cnjRaw, reason: v.why, action: 'Corrigir o número na base (linha ' + (r._i + 3) + ').' }); });
  wd.forEach((w, i) => { const v = cnjValid(w.cnj); if (!v.ok) add('AUD-001', w.cnj, { ref: 'wd' + i, suffix: 'w' + i, field: 'Lawsuit Number', plaintiff: w.plaintiff, word: w.lawsuit || '(vazio)', reason: `Word (${w.caseName}): ${w.lawsuit ? v.why : 'campo vazio'}`, action: 'Preencher/corrigir o Lawsuit number no Word.' }); });
  // AUD-002
  Object.entries(exBy).forEach(([c, rs]) => { if (c && rs.length > 1) add('AUD-002', c, { field: 'Lawsuit Number', reason: `CNJ aparece ${rs.length}× no Excel (linhas ${rs.map(r => r._i + 3).join(', ')}).`, action: 'Manter uma linha e registrar a exclusão.' }); });
  Object.entries(wdBy).forEach(([c, ws]) => { if (c && c !== 'null' && ws.length > 1) add('AUD-002', c, { suffix: 'w', field: 'Lawsuit Number', reason: `CNJ aparece ${ws.length}× no Word geral (${ws.map(w => w.caseName).join(' / ')}).`, action: 'Remover o bloco duplicado do Word.' }); });
  const wdNames = {}; wdGen.forEach(w => { const k = strip(w.caseName); (wdNames[k] = wdNames[k] || []).push(w); });
  Object.values(wdNames).forEach(ws => { if (ws.length > 1 && new Set(ws.map(w => w.cnj)).size > 1) ws.forEach(w => { /* same name, different CNJs: informative only */ }); });

  for (const c of pop) {
    if (!c) continue;
    const r = exBy[c]?.[0] || null, w = wdBy[c]?.[0] || null, cl = closedBy[c] || null;
    const W = w || cl;
    const pl = plaintiffOf(c);
    const inst = ctx.dj?.[c] || null, S = djSummary(inst);
    const b = base?.[c] || null;
    const cnjYear = c.length === 20 ? +c.slice(9,13) : null;
    const exStage = r ? stageFromExcel(r.posicao) : null;
    const wStage = W ? stageFromWord(W.stage) : null;
    const closedInternal = r && (r.situacao === 'Encerrado' || exStage === 'COMPLETED');
    const common = { plaintiff: pl };

    // AUD-003
    if (r && W && r.autor && W.plaintiff) { const s = nameSim(r.autor, W.plaintiff); if (s < 0.6) add('AUD-003', c, { ...common, field: 'Plaintiff', excel: r.autor, word: W.plaintiff, reason: `Similaridade de nome ${(s * 100).toFixed(0)}%.`, action: 'Confirmar se o CNJ pertence a este autor.' }); }
    // AUD-004
    if (r && W && W.defendant) {
      const isSeeds = /seeds|sementes/i.test(W.defendant), exSeeds = r.empresa === 'Seeds';
      if (isSeeds !== exSeeds) add('AUD-004', c, { ...common, field: 'Defendant', excel: `${r.empresa} · ${r.reu || ''}`, word: W.defendant, reason: `Excel indica ${r.empresa}; Word reporta "${W.defendant}".`, action: 'Confirmar a entidade ré e o relatório (Crop/Seeds).' });
    }
    // AUD-005
    if (cnjYear) {
      const wy = W && /\b(19|20)\d{2}\b/.exec(W.filing || '')?.[0];
      if (wy && +wy !== cnjYear) add('AUD-005', c, { ...common, field: 'Date of First Court Filing', excel: r?.distrib, word: W.filing, reason: `CNJ é de ${cnjYear}; Word informa ${wy}.`, action: `Ajustar Filing para ${cnjYear}.`, suggested: String(cnjYear) });
      else if (r?.distrib && +r.distrib.slice(0,4) !== cnjYear && Math.abs(+r.distrib.slice(0,4) - cnjYear) > 0) add('AUD-005', c, { ...common, suffix: 'x', field: 'Data de distribuição', excel: r.distrib, reason: `CNJ é de ${cnjYear}; distribuição no Excel em ${r.distrib.slice(0,4)}.`, action: 'Conferir data de distribuição.' });
    }
    // AUD-006
    if (r && S) {
      const d = djStage(S);
      let bad = null;
      if (exStage === 'PENDING' && (d === 'APPEAL' || d === 'ENFORCEMENT' || d === 'COMPLETED')) bad = d;
      else if (exStage === 'APPEAL' && (d === 'ENFORCEMENT' || d === 'COMPLETED')) bad = d;
      else if (exStage === 'COMPLETED' && d !== 'COMPLETED') bad = d;
      else if (exStage === 'ENFORCEMENT' && d === 'COMPLETED') bad = d;
      if (bad) add('AUD-006', c, { ...common, field: 'Case Stage', excel: r.posicao, datajud: STAGE_LABEL[bad] + ` (graus: ${S.graus.join(', ')})`, latest: S.lastAny && `${S.lastAny.d} · ${S.lastAny.n} (${S.lastAny.grau})`, reason: `Excel em "${r.posicao}", DataJud indica ${STAGE_LABEL[bad]}.`, action: 'Review Required: confirmar a fase atual.', suggested: STAGE_LABEL[bad] });
    }
    // AUD-007
    if (r && w && exStage && wStage && exStage !== wStage) add('AUD-007', c, { ...common, field: 'Case Stage', excel: r.posicao, word: w.stage, reason: `Word "${w.stage}" × Excel "${r.posicao}" (esperado ${STAGE_LABEL[exStage]}).`, action: 'Alinhar Stage do Word com a base.', suggested: STAGE_LABEL[exStage] });
    // AUD-008
    if (W && S && S.lastRel) {
      const lr = S.lastRel, active = wStage && wStage !== 'COMPLETED';
      if (active && ['transito', 'baixa'].includes(lr.c) && lr.c === (Object.entries(S.flags).sort((a, b) => a[1] < b[1] ? 1 : -1)[0] || [])[0]) add('AUD-008', c, { ...common, field: 'Case Stage', word: W.stage, datajud: `${RELEVANT[lr.c]} em ${lr.d}`, latest: `${lr.d} · ${lr.n} (${lr.grau})`, reason: `Stage ativo, mas último andamento relevante é ${RELEVANT[lr.c]}.`, action: 'Review Required: avaliar encerramento.' });
      if (wStage === 'COMPLETED' && ['sentenca', 'acordao', 'recurso', 'execucao'].includes(lr.c) && (!S.flags.baixa || lr.d > S.flags.baixa)) add('AUD-008', c, { ...common, suffix: 'c', field: 'Case Stage', word: W.stage, latest: `${lr.d} · ${lr.n}`, reason: 'Completed, mas há andamento substantivo posterior à baixa.', action: 'Review Required.' });
    }

  const limit = Math.min(rows.length, 15);
  for (let i = 0; i < limit; i++) {
    const hs = (rows[i] || []).map(norm);
    let score = 0;
    for (const h of hs) if (h && FIELDS.some((f) => f.when(h))) score++;
    if (score > best.score) best = { idx: i, score };
  }
  return best;
}

function colLetter(n) {
  let s = "";
  n++;
  while (n > 0) {
    const r = (n - 1) % 26;
    s = String.fromCharCode(65 + r) + s;
    n = Math.floor((n - 1) / 26);
  }
  return s;
}

function excelDate(v) {
  if (v === null || v === undefined || v === "" || v === "-") return null;
  const s = String(v).trim();
  if (/^\d{4,5}(\.\d+)?$/.test(s)) {
    const d = new Date(Date.UTC(1899, 11, 30) + Math.round(+s) * 86400000);
    return d.toISOString().slice(0, 10);
  }
  let m = /^(\d{2})\/(\d{2})\/(\d{4})/.exec(s);
  if (m) return `${m[3]}-${m[2]}-${m[1]}`;
  m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
  if (m) return m[0];
  return null;
}
function toNum(v) {
  if (v === null || v === undefined) return null;
  const s = String(v).trim();
  if (!s || s === "-") return null;
  if (/^-?\d+(\.\d+)?(e-?\d+)?$/i.test(s)) return +s;
  const br = s.replace(/[^\d,.\-]/g, "");
  if (/,\d{1,2}$/.test(br)) return +br.replace(/\./g, "").replace(",", ".");
  const n = +br.replace(/,/g, "");
  return isNaN(n) ? null : n;
}
const clean = (v) => {
  if (v === null || v === undefined) return null;
  const s = String(v).trim();
  return s === "" || s === "-" ? null : s;
};

/**
 * @param rows  array de linhas (arrays) como devolvido por parseXlsx
 * @param opts  { cycleId?: "Q3-2026" }  força qual quarter é o atual
 */
function mapModel(rows, opts = {}) {
  const warnings = [];
  const { idx: hIdx, score } = findHeaderRow(rows);
  const headers = (rows[hIdx] || []).map((h) => String(h ?? ""));
  const H = headers.map(norm);
  if (score < 5) warnings.push("Não reconheci o cabeçalho do modelo com segurança: confira o mapeamento abaixo.");

  // quarters presentes nos cabeçalhos
  const qs = {};
  H.forEach((h) => { const q = quarterOf(h); if (q) qs[q.id] = q; });
  const qList = Object.values(qs).sort((a, b) => a.y * 10 + a.q - (b.y * 10 + b.q));
  let cur = opts.cycleId ? qs[opts.cycleId] || quarterOf(opts.cycleId.replace("-", "/")) : qList[qList.length - 1];
  if (opts.cycleId && !qs[opts.cycleId]) warnings.push(`A planilha não cita ${opts.cycleId} nos cabeçalhos; quarters encontrados: ${qList.map((q) => q.id).join(", ") || "nenhum"}.`);
  const curId = cur ? cur.id : null;

  const map = {}; // key -> column index
  const used = new Set();
  for (const f of FIELDS) {
    for (let i = 0; i < H.length; i++) {
      if (used.has(i) || !H[i] || !f.when(H[i])) continue;
      const q = quarterOf(H[i]);
      if (f.period === "cur" && !(q && q.id === curId)) continue;
      if (f.period === "prev" && q && q.id === curId) continue;
      if (f.period === "prev" && !q && !/^dolar/.test(H[i])) continue;
      if (!f.period && q && f.key !== "cnj") { /* colunas sem período podem ter data no nome */ }
      map[f.key] = i; used.add(i);
      if (f.period === "prev" && q && cur && !(q.y * 10 + q.q < cur.y * 10 + cur.q)) warnings.push(`Coluna "${headers[i]}" foi tratada como quarter anterior, mas cita ${q.id}.`);
      break;
    }
  }

  // "Status - Q2.2025" é o anterior; "Comparativo - Q3.2026" o atual; sem quarter não entra.
  // Coluna do processo: se o nome não foi reconhecido, procura pelo formato CNJ.
  let cnjBy = "cabeçalho";
  if (map.cnj === undefined) {
    let best = { i: -1, share: 0 };
    for (let i = 0; i < headers.length; i++) {
      let n = 0, ok = 0;
      for (let r = hIdx + 1; r < Math.min(rows.length, hIdx + 201); r++) {
        const v = rows[r] && rows[r][i];
        if (v === undefined || v === null || String(v).trim() === "") continue;
        n++; if (looksCnj(v)) ok++;
      }
      const share = n ? ok / n : 0;
      if (share > best.share) best = { i, share };
    }
    if (best.share >= 0.6) { map.cnj = best.i; cnjBy = `formato CNJ (${Math.round(best.share * 100)}% dos valores)`; }
  }

  // parâmetros lidos do próprio modelo
  const params = {};
  const acimaH = map.acimaCur !== undefined ? headers[map.acimaCur] : null;
  const t = acimaH && /acima de\s*([\d.,]+)\s*(k|mil)?/i.exec(norm(acimaH));
  if (t) params.threshold = toNum(t[1]) * (t[2] ? 1000 : 1);
  const usdH = map.usdCur !== undefined ? headers[map.usdCur] : null;
  const fx = usdH && /(\d+[.,]\d+)/.exec(usdH);
  if (fx) params.fx = +fx[1].replace(",", ".");
  // cabeçalho de USD anterior com quarter diferente do anterior esperado
  if (map.usdPrev !== undefined && map.valorPrev !== undefined) {
    const a = quarterOf(H[map.usdPrev]), b = quarterOf(H[map.valorPrev]);
    if (a && b && a.id !== b.id) warnings.push(`Cabeçalho "${headers[map.usdPrev]}" cita ${a.id}, mas o valor BRL anterior é ${b.id}: provável erro de digitação no modelo.`);
  }

  const missing = FIELDS.filter((f) => f.required && map[f.key] === undefined).map((f) => f.label);
  if (missing.length) warnings.push("Campos obrigatórios não encontrados: " + missing.join(", ") + ".");

  // linhas
  const records = [];
  for (let r = hIdx + 1; r < rows.length; r++) {
    const row = rows[r] || [];
    if (!row.some((v) => clean(v))) continue;
    const rec = { _row: r + 1 };
    for (const f of FIELDS) {
      const i = map[f.key];
      if (i === undefined) continue;
      const v = row[i];
      rec[f.key] = f.date ? excelDate(v) : f.num ? toNum(v) : clean(v);
    }
    rec.cnjRaw = rec.cnj;
    rec.cnj = onlyDigits(rec.cnj) || null;
    if (!rec.cnjRaw && !rec.autor) continue;
    records.push(rec);
  }

  const mapping = FIELDS.map((f) => ({
    key: f.key, label: f.label, required: !!f.required,
    col: map[f.key] !== undefined ? colLetter(map[f.key]) : null,
    header: map[f.key] !== undefined ? headers[map[f.key]] : null,
    how: f.key === "cnj" && map.cnj !== undefined ? cnjBy : undefined,
  }));
  const unmapped = headers.map((h, i) => ({ col: colLetter(i), header: h })).filter((x, i) => x.header && !used.has(i) && i !== map.cnj);

  return {
    headerRow: hIdx + 1,
    headers,
    cycleId: curId,
    quarters: qList.map((q) => q.id),
    params,
    mapping,
    unmapped,
    warnings,
    processColumn: map.cnj !== undefined ? { col: colLetter(map.cnj), header: headers[map.cnj], how: cnjBy } : null,
    records,
  };
}

return { mapModel, FIELDS, excelDate, toNum, norm, colLetter };

})();

/* ===== Resumo de retorno do DataJud ===== */
const DJ = (() => {
// Sincronização em lote com a API Pública do DataJud para a população do quarter.
// Usa o callDataJud do server.js (mesma chave e mesmo cliente HTTP).
// Para cada CNJ consulta o índice do tribunal de origem e, na Justiça do
// Trabalho, também o TST: o mesmo número pode ter uma instância por grau.

const CATS = [
  ["transito", /tr[aâ]nsito em julgado/i],
  ["baixa", /baixa definitiva|arquivamento|arquivad/i],
  ["acordo", /homologa[cç][aã]o de transa|acordo|concilia[cç][aã]o/i],
  ["pagamento", /pagamento|levantamento|libera[cç][aã]o de (valor|dep)/i],
  ["calculos", /homologa[cç][aã]o.*c[aá]lcul|liquida[cç][aã]o/i],
  ["execucao", /execu[cç][aã]o/i],
  ["acordao", /provimento|ac[oó]rd[aã]o|conhecimento em parte|n[aã]o conhecimento|n[aã]o-conhecimento/i],
  ["sentenca", /proced[eê]ncia|improced[eê]ncia|extin[cç][aã]o|julgamento|senten[cç]a|resolu[cç][aã]o do m[eé]rito/i],
  ["recurso", /recurso|agravo|embargos/i],
];
const classify = (n) => { for (const [k, re] of CATS) if (re.test(n || "")) return k; return null; };

function summarize(src) {
  const mv = (src.movimentos || []).filter((m) => m.dataHora).sort((a, b) => (a.dataHora < b.dataHora ? -1 : 1));
  const rel = mv.map((m) => ({ d: m.dataHora.slice(0, 10), n: m.nome, c: classify(m.nome) })).filter((m) => m.c);
  const flags = {};
  rel.forEach((m) => { flags[m.c] = m.d; });
  const last = mv[mv.length - 1];
  return {
    trib: src.tribunal, grau: src.grau, classe: src.classe && src.classe.nome, orgao: src.orgaoJulgador && src.orgaoJulgador.nome,
    ajuiz: (src.dataAjuizamento || "").slice(0, 8), upd: (src.dataHoraUltimaAtualizacao || "").slice(0, 10), nMov: mv.length,
    last: last ? { d: last.dataHora.slice(0, 10), n: last.nome } : null,
    rel, flags,
    recent: mv.slice(-12).map((m) => ({ d: m.dataHora.slice(0, 10), n: m.nome })),
  };
}

return { summarize, classify };
})();

/* ===== Word (.docx): leitura e Track Changes no navegador (JSZip) ===== */
const DOCX = (() => {
const unesc = (s) => s.replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, "&");

// texto "aceito": inclui inserções, ignora exclusões (w:delText)
function cellText(xml) {
  return xml
    .split(/<\/w:p>/)
    .map((p) => [...p.matchAll(/<w:t(?:\s[^>]*)?>([^<]*)<\/w:t>/g)].map((m) => unesc(m[1])).join(""))
    .filter((t) => t.trim())
    .join(" ")
    .replace(/ /g, " ")
    .replace(/[ \t]+/g, " ")
    .trim();
}
const revCount = (xml) => (xml.match(/<w:(ins|del)\b[^>]*>/g) || []).length;

const LABELS = [
  ["case name", "caseName"], ["plaintiff", "plaintiff"], ["defendant", "defendant"], ["venue", "venue"],
  ["type of matter", "matter"], ["lawsuit number", "lawsuit"], ["case description", "status"], ["case stage", "stage"],
  ["financial relief sought (local", "reliefBRL"], ["financial relief sought (usd", "reliefUSD"], ["exchange rate", "fx"],
  ["loss reserve", "reserve"], ["likelihood", "risk"], ["date of first court filing", "filing"], ["estimated date", "estCompletion"],
  ["actual date", "actualCompletion"], ["comments of case reporter", "comments"], ["this report has been submitted", "submittedBy"],
  ["date of last update", "lastUpdate"], ["management", "mgmt"], ["contacts", "contacts"],
];
const labelKey = (s) => {
  const t = s.toLowerCase().replace(/\s+/g, " ").trim();
  for (const [p, k] of LABELS) if (t.startsWith(p)) return k;
  return null;
};


function money(s) {
  if (!s) return null;
  const m = /([\d.,]*\d)/.exec(String(s).replace(/\s/g, ""));
  if (!m) return null;
  let x = m[1];
  if (x.includes(",") && x.lastIndexOf(",") > x.lastIndexOf(".")) x = x.replace(/\./g, "").replace(",", ".");
  else x = x.replace(/,/g, "");
  const n = parseFloat(x);
  return isNaN(n) ? null : n;
}
const fxNum = (s) => { const m = /(\d+[.,]\d+)/.exec(s || ""); return m ? +m[1].replace(",", ".") : null; };

function enrich(rec) {
  rec.cnj = String(rec.lawsuit || "").replace(/\D/g, "") || null;
  rec.reliefBRLn = money(rec.reliefBRL);
  rec.reliefUSDn = money(rec.reliefUSD);
  rec.reserveN = money(rec.reserve);
  rec.fxN = fxNum(rec.fx);
  return rec;
}


  async function parseReport(buf, kind) {
    const zip = await JSZip.loadAsync(buf);
    const f = zip.file("word/document.xml");
    if (!f) throw new Error("Não encontrei word/document.xml dentro do arquivo.");
    const xml = await f.async("string");
    const head = cellText(xml.slice(0, 60000)).slice(0, 4000);
    const scope = /\bseeds\b/i.test(head) && !/\bcrop\b/i.test(head) ? "Seeds" : "Crop";
  const records = [];
  for (const tm of xml.matchAll(/<w:tbl>[\s\S]*?<\/w:tbl>/g)) {
    const tbl = tm[0];
    const rec = { kind, rev: revCount(tbl), revFields: [] };
    let isCase = false;
    for (const rm of tbl.matchAll(/<w:tr[\s>][\s\S]*?<\/w:tr>/g)) {
      const cells = [...rm[0].matchAll(/<w:tc>[\s\S]*?<\/w:tc>/g)].map((c) => c[0]);
      if (cells.length < 2) continue;
      const key = labelKey(cellText(cells[0]));
      if (!key) continue;
      if (key === "caseName") isCase = true;
      if (rec[key] === undefined) {
        rec[key] = cellText(cells.slice(1).join(""));
        if (revCount(cells.slice(1).join(""))) rec.revFields.push(key);
      }
    }
    if (isCase) records.push(enrich(rec));
  }
    return { scope, records };
  }
  const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  async function applyTrackChanges(buf, changes, author) {
    const zip = await JSZip.loadAsync(buf);
    let xml = await zip.file("word/document.xml").async("string");
  const when = new Date().toISOString().replace(/\.\d+Z$/, "Z");
  let rid = 900000;
  const applied = [], seen = new Set();
  xml = xml.replace(/<w:tbl>[\s\S]*?<\/w:tbl>/g, (tbl) => {
    let cnj = null, caseName = "";
    for (const rm of tbl.matchAll(/<w:tr[\s>][\s\S]*?<\/w:tr>/g)) {
      const cs = [...rm[0].matchAll(/<w:tc>[\s\S]*?<\/w:tc>/g)].map((c) => c[0]);
      if (cs.length < 2) continue;
      const k = labelKey(cellText(cs[0]));
      if (k === "lawsuit") cnj = cellText(cs.slice(1).join("")).replace(/\D/g, "");
      if (k === "caseName") caseName = cellText(cs.slice(1).join(""));
    }
    const ch = cnj && changes[cnj];
    if (!ch) return tbl;
    seen.add(cnj);
    return tbl.replace(/<w:tr[\s>][\s\S]*?<\/w:tr>/g, (tr) => {
      const cells = [...tr.matchAll(/<w:tc>[\s\S]*?<\/w:tc>/g)].map((c) => c[0]);
      if (cells.length < 2) return tr;
      const key = labelKey(cellText(cells[0]));
      if (!key || ch[key] === undefined) return tr;
      const cell = cells[1];
      const val = ch[key];
      if (val && typeof val === "object" && val.append) {
        // inserção ao final do texto existente (ex.: novo andamento no Status Update)
        const runs = cell.match(/<w:rPr>[\s\S]*?<\/w:rPr>/g) || [];
        const rPrA = runs.length ? runs[runs.length - 1] : "";
        const insA = `<w:ins w:id="${rid++}" w:author="${esc(author)}" w:date="${when}"><w:r>${rPrA}<w:t xml:space="preserve"> ${esc(val.append)}</w:t></w:r></w:ins>`;
        const at = cell.lastIndexOf("</w:p>");
        if (at < 0) return tr;
        applied.push({ cnj, caseName, field: key, from: "", to: "+ " + val.append });
        return tr.replace(cell, cell.slice(0, at) + insA + cell.slice(at));
      }
      const from = cellText(cell), to = String(val);
      if (from.replace(/\s+/g, " ").trim() === to.trim()) return tr;
      const tcPr = (/<w:tcPr>[\s\S]*?<\/w:tcPr>/.exec(cell) || [""])[0];
      const pPr = (/<w:pPr>[\s\S]*?<\/w:pPr>/.exec(cell) || [""])[0];
      const rPr = (/<w:rPr>[\s\S]*?<\/w:rPr>/.exec(cell.replace(/<w:pPr>[\s\S]*?<\/w:pPr>/, "")) || [""])[0];
      const del = from ? `<w:del w:id="${rid++}" w:author="${esc(author)}" w:date="${when}"><w:r>${rPr}<w:delText xml:space="preserve">${esc(from)}</w:delText></w:r></w:del>` : "";
      const ins = `<w:ins w:id="${rid++}" w:author="${esc(author)}" w:date="${when}"><w:r>${rPr}<w:t xml:space="preserve">${esc(to)}</w:t></w:r></w:ins>`;
      const newCell = `<w:tc>${tcPr}<w:p>${pPr}${del}${ins}</w:p></w:tc>`;
      applied.push({ cnj, caseName, field: key, from, to });
      return tr.replace(cell, newCell);
    });
  });
    zip.file("word/document.xml", xml);
    const data = await zip.generateAsync({ type: "uint8array", compression: "DEFLATE" });
    return { data, applied, missing: Object.keys(changes).filter((c) => !seen.has(c)) };
  }
  return { parseReport, applyTrackChanges };
})();

/* ===== Serviço do Litigation Audit Desk no navegador (db + downloads + user) ===== */
const SVC = (() => {
  const DEFAULT_PARAMS = { threshold: 125000, fx: 5.7, materiality: 0.2, fxTol: 0.01, wordScope: ["Crop"], djScope: "population" };
  const DECISIONS = { ACCEPT: "Accept external data", KEEP: "Keep internal data", MANUAL: "Manual correction", JUSTIFIED: "Justified exception" };
  const RISK_EN = { "Provável": "Probable", "Possível": "Possible", "Remota": "Remote" };
  const ORD = ["1st", "2nd", "3rd", "4th"];
  const fmtBR = (v) => Number(v).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const idRe = /^Q([1-4])-(\d{4})$/;
  const prevId = (id) => { const m = idRe.exec(id); const q = +m[1], y = +m[2]; return q === 1 ? `Q4-${y - 1}` : `Q${q - 1}-${y}`; };
  const nowIso = () => new Date().toISOString();

      [db, userCap, dl] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("downloads")]);
    }
    if (userCap) {
      try {
        const m = await userCap.me();
        me.id = m && m.id ? m.id : (userCap.id ? await userCap.id() : null);
        me.name = (m && m.name) || "";
        if (!me.name && me.id) { const ps = await userCap.profiles([me.id]); me.name = (ps[me.id] && ps[me.id].name) || ""; }
      } catch (e) {}
    }
    return { db: !!db, downloads: !!dl, user: me };
  }
  const need = () => { if (!db) throw new Error("A base compartilhada não está disponível nesta visualização. Abra o link do artefato no Claude."); };

  /* ---------- chunks ---------- */
  async function putChunks(cid, prefix, arr, maxBytes = 170000) {
    need();
    const chunks = []; let cur = [], size = 2;
    for (const it of arr) {
      const s = JSON.stringify(it).length + 1;
      if (cur.length && size + s > maxBytes) { chunks.push(cur); cur = []; size = 2; }
      cur.push(it); size += s;
    }
    if (cur.length || !chunks.length) chunks.push(cur);
    for (let i = 0; i < chunks.length; i++) await db.doc(`cycles/${cid}/data/${prefix}-${i}`).set({ i, rows: chunks[i] });
    return chunks.length;
  }
  async function getChunks(cid, prefix, n) {
    const out = [];
    const snaps = await Promise.all(Array.from({ length: n || 0 }, (_, i) => db.doc(`cycles/${cid}/data/${prefix}-${i}`).get()));
    snaps.forEach((s) => { if (s.exists) out.push(...(s.data().rows || [])); });

  async function putB64(cid, prefix, b64) {
    const parts = []; for (let i = 0; i < b64.length; i += 180000) parts.push(b64.slice(i, i + 180000));
    for (let i = 0; i < parts.length; i++) await db.doc(`cycles/${cid}/data/${prefix}-${i}`).set({ i, rows: [parts[i]] });
    return parts.length;
  }
  const getB64 = async (cid, prefix, n) => (await getChunks(cid, prefix, n)).join("");
  const toB64 = (buf) => { let s = ""; const b = new Uint8Array(buf); for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); };
  const fromB64 = (b64) => { const s = atob(b64); const b = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return b; };

  async function saveCycle(c) { need(); c.updatedAt = nowIso(); await db.doc(`cycles/${c.id}`).set(JSON.parse(JSON.stringify(c))); if (MEM[c.id]) MEM[c.id].cycle = c; return c; }
  async function getCycle(id) { need(); const s = await db.doc(`cycles/${id}`).get(); return s.exists ? s.data() : null; }
  async function trail(c, entry) {
    const e = Object.assign({ ts: nowIso(), quarter: c.id, userId: me.id || null }, entry);
    try { await db.collection(`cycles/${c.id}/trail`).add(e); } catch (err) { console.warn(err); }
    if (MEM[c.id] && MEM[c.id].trail) MEM[c.id].trail.push(e);

  }
  async function readTrail(cid) {

    const t = s.docs.map((d) => d.data());

  async function load(cid, force) {

    if (c.datajud) {
      const rows = await getChunks(cid, "dj", c.datajud.chunks);
      const results = {}; rows.forEach((r) => { results[r.k] = r.v; });
      m.dj = { results, notFound: c.datajud.notFoundList || [], errors: [], unroutable: [] };
    }
    const ds = await db.collection(`cycles/${cid}/decisions`).get();
    ds.docs.forEach((d) => { m.decisions[d.id] = d.data(); });
    MEM[cid] = m;
    return m;
  }

  async function baselineFor(cid) {
    const prev = await getCycle(prevId(cid)).catch(() => null);
    if (prev && prev.status === "CLOSED" && prev.closed && prev.closed.validatedChunks) {
      const recs = await getChunks(prev.id, "validated", prev.closed.validatedChunks);
      const baseline = {}; recs.forEach((r) => { baseline[r.cnj] = r; });
      return { baseline, baselineClosed: new Set(prev.closed.closedReport || []), from: `${prev.id} fechado em ${prev.closed.at.slice(0, 10)} (base validada)` };
    }
    return { baseline: null, baselineClosed: null, from: "Colunas do quarter anterior na própria planilha" };
  }

  async function ctxOf(cid) {
    const m = await load(cid);
    const c = m.cycle;
    const stamp = c.updatedAt + "|" + Object.keys(m.decisions).length;
    if (cache[cid] && cache[cid].stampData === c.updatedAt) { cache[cid].m = m; return cache[cid]; }
    const B = await baselineFor(cid);
    const scopes = new Set((c.inputs.wordGeneral || []).map((w) => w.scope));
    const docxRev = {}; let hasRev = false;
    m.word.forEach((w) => { if (w.kind === "general" && w.rev !== undefined && w.cnj) docxRev[w.cnj] = w.rev; if (w.kind === "general" && w.rev > 0) hasRev = true; });
    const params = Object.assign({}, DEFAULT_PARAMS, c.params, { wordScope: scopes.size ? [...scopes] : (c.params && c.params.wordScope) || ["Crop"] });
    const ctx = { cycleId: cid, params, excel: m.excel, word: m.word, dj: m.dj ? m.dj.results : {}, baseline: B.baseline, baselineClosed: B.baselineClosed, docxRev: hasRev ? docxRev : null };
    const issues = c.inputs.excel ? runAudit(ctx) : [];
    cache[cid] = { stampData: c.updatedAt, ctx, issues, baselineFrom: B.from, djMeta: m.dj, m };
    return cache[cid];
  }
  const invalidate = (cid) => { delete cache[cid]; };

  const withDecisions = (m, issues) => issues.map((i) => { const d = m.decisions[safeKey(i.key)]; return Object.assign({}, i, { status: d ? "Validated" : "Open", decision: d || null, ruleName: RULE[i.rule].name, allowed: RULE[i.rule].acoes }); });
  const safeKey = (k) => String(k).replace(/[^A-Za-z0-9_\-.~:@+]/g, "_").slice(0, 190);

  function thrClass(r, P, base) {
    const u1 = r.usdCur, u0 = base ? base.usdCur : r.usdPrev;
    if (u1 === null || u1 === undefined) return "—";
    const a1 = u1 >= P.threshold;
    if (u0 !== null && u0 !== undefined) { const a0 = u0 >= P.threshold; if (a1 && !a0) return "Crossed Threshold – IN"; if (!a1 && a0) return "Crossed Threshold – OUT"; }
    return a1 ? "Above Threshold" : "Below Threshold";
  }
  function stats(L, issues) {
    const s = { total: issues.length, open: 0, blocking: 0, bySev: { C: { open: 0, done: 0 }, R: { open: 0, done: 0 }, Q: { open: 0, done: 0 } }, byRule: {} };
    for (const i of issues) {
      const open = i.status === "Open";
      s.bySev[i.sev][open ? "open" : "done"]++;
      if (open) s.open++;
      if (open && i.block) s.blocking++;
      const r = (s.byRule[i.rule] = s.byRule[i.rule] || { open: 0, done: 0 });
      r[open ? "open" : "done"]++;
    }
    s.cases = L.ctx.excel.length;
    s.reportable = L.ctx.excel.filter((r) => r.repCur === "Sim").length;
    return s;
  }
  const statusOf = (c, st) => (c.status === "CLOSED" ? "CLOSED" : !c.inputs.excel ? "AWAITING INPUT" : st.blocking === 0 ? "READY TO CLOSE" : "OPEN");

  function populationCnjs(ctx) {
    const cnjs = new Set();
    ctx.excel.forEach((r) => { if (r.repCur === "Sim" || r.repPrev === "Sim" || (r.litCur && r.litCur !== "NÃO ENTRA")) cnjs.add(r.cnj); });
    ctx.word.forEach((w) => w.cnj && cnjs.add(w.cnj));
    return [...cnjs].filter(Boolean);
  }
  function population(L) {
    const { ctx } = L, P = ctx.params;
    const words = {}; ctx.word.forEach((w) => { if (w.cnj) (words[w.cnj] = words[w.cnj] || []).push(w); });
    const exBy = {}; ctx.excel.forEach((r) => { if (!exBy[r.cnj]) exBy[r.cnj] = r; });
    const nf = new Set((L.djMeta && L.djMeta.notFound) || []);
    return populationCnjs(ctx).map((cnj) => {
      const r = exBy[cnj] || {}, ws = words[cnj] || [], S = djSummary(ctx.dj[cnj]);
      const g = ws.find((w) => w.kind === "general"), cl = ws.find((w) => w.kind === "closed");
      return {
        cnj, cnjFmt: fmtCnj(cnj), autor: r.autor || (g || cl || {}).plaintiff || (g || cl || {}).caseName, empresa: r.empresa || "—",
        posicao: r.posicao || null, wordStage: g ? g.stage : cl ? cl.stage : null,
        report: g ? "General" : cl ? "Closed" : r.repCur === "Sim" ? ((P.wordScope || []).includes(r.empresa) ? "Não está no Word" : `Word ${r.empresa} não carregado`) : "—",
        repCur: r.repCur || null, statusCur: r.statusCur || null, prob: r.prob || null, vProv: r.vProv ?? null, valorCur: r.valorCur ?? null, usdCur: r.usdCur ?? null,
        thr: r.cnj ? thrClass(r, P, ctx.baseline && ctx.baseline[cnj]) : "—",
        djFound: !!S, djLast: S && S.lastAny ? S.lastAny : null, djLastRel: S && S.lastRel ? { d: S.lastRel.d, n: S.lastRel.n, c: RELEVANT[S.lastRel.c] } : null,
        djNotFound: nf.has(cnj),
      };
    });
  }
  function summarizeInputs(c) {
    const i = c.inputs || {};
    return {
      excel: i.excel ? { name: i.excel.name, at: i.excel.at, by: i.excel.by, rows: i.excel.rows, processColumn: i.excel.processColumn, headerRow: i.excel.headerRow, warnings: i.excel.warnings } : null,
      wordGeneral: (i.wordGeneral || []).map((w) => ({ name: w.name, at: w.at, by: w.by, scope: w.scope, records: w.records, withRevisions: w.withRevisions })),
      wordClosed: i.wordClosed ? { name: i.wordClosed.name, at: i.wordClosed.at, records: i.wordClosed.records } : null,
    };
  }

  /* ---------- API ---------- */
  function meta() { return { engine: ENGINE_VERSION, rules: RULES, decisions: DECISIONS, dataDir: "Base compartilhada deste artefato", user: me.name || "", defaults: DEFAULT_PARAMS }; }

  async function cycles() {
    if (!db) return { cycles: [] };
    const s = await db.collection("cycles").get();
    const list = [];
    for (const d of s.docs) {
      const c = d.data();
      let st = null;
      try { const L = await ctxOf(c.id); st = stats(L, withDecisions(L.m, L.issues)); } catch (e) { console.warn(e); }
      list.push({ id: c.id, status: st ? statusOf(c, st) : c.status, createdAt: c.createdAt, updatedAt: c.updatedAt, inputs: summarizeInputs(c), datajud: c.datajud || null, stats: st, closed: c.closed || null });
    }
    list.sort((a, b) => { const k = (x) => x.id.slice(3) + x.id[1]; return k(a) < k(b) ? 1 : -1; });
    return { cycles: list };
  }

  async function createCycle(b) {
    need();
    const id = String(b.id || "").toUpperCase().trim();
    if (!idRe.test(id)) throw new Error("Use o formato Q4-2026.");
    if (await getCycle(id)) throw new Error(`${id} já existe.`);
    const prev = await getCycle(prevId(id));
    const params = Object.assign({}, DEFAULT_PARAMS, prev ? prev.params : {}, b.params || {});
    const c = await saveCycle({ id, status: "OPEN", createdAt: nowIso(), createdBy: b.user || me.name, createdById: me.id, params, inputs: { wordGeneral: [] }, baselineOf: prev ? prev.id : null });
    await trail(c, { source: "Sistema", reason: `Novo ciclo aberto${prev ? ` (baseline: ${prev.id}, status ${prev.status})` : ""}`, user: c.createdBy });
    return { cycle: c };
  }

  async function cycle(id) {
    const L = await ctxOf(id);
    const c = L.m.cycle;
    const issues = withDecisions(L.m, L.issues);
    const st = stats(L, issues);
    return { cycle: Object.assign({}, c, { status: statusOf(c, st) }), stats: st, inputs: summarizeInputs(c), mapping: c.inputs.excel ? c.inputs.excel.mapping : null, baselineFrom: L.baselineFrom, job: null, params: L.ctx.params, djMeta: L.djMeta ? { notFound: L.djMeta.notFound || [], errors: [], unroutable: [] } : null, request: c.djRequest || null };
  }
  async function audit(id) {
    const L = await ctxOf(id);
    const issues = withDecisions(L.m, L.issues);
    const st = stats(L, issues);
    return { status: statusOf(L.m.cycle, st), stats: st, issues, cases: population(L) };
  }

  async function upload(id, kind, file, user) {
    need();
    const m = await load(id);
    const c = m.cycle;
    if (c.status === "CLOSED") throw new Error("Quarter fechado: não aceita novos arquivos.");
    const buf = await file.arrayBuffer();
    const by = user || me.name;
    if (kind === "excel") {
      if (!/\.xlsx$/i.test(file.name)) throw new Error("Envie a base em .xlsx.");
      const wb = XLSX.read(buf, { type: "array", cellDates: false });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: "" });
      const mm = TPL.mapModel(rows, { cycleId: id });
      if (!mm.processColumn) throw new Error("Não encontrei a coluna do número do processo nem por nome nem pelo formato CNJ.");
      const chunks = await putChunks(id, "excel", mm.records);
      const rawChunks = await putB64(id, "excel-raw", toB64(buf));
      c.inputs.excel = { name: file.name, at: nowIso(), by, rows: mm.records.length, processColumn: mm.processColumn, headerRow: mm.headerRow, warnings: mm.warnings, detectedParams: mm.params, mapping: mm.mapping, chunks, rawChunks, sheet: wb.SheetNames[0] };
      if (mm.params.threshold && !c.paramsLocked) c.params.threshold = mm.params.threshold;
      if (mm.params.fx && !c.paramsLocked) c.params.fx = mm.params.fx;
      m.excel = mm.records;
      await saveCycle(c); invalidate(id);
      await trail(c, { source: "Upload", field: "Excel do quarter", new: file.name, reason: `${mm.records.length} processos; coluna do processo ${mm.processColumn.col} (${mm.processColumn.how})`, user: by });
      const L = await ctxOf(id);
      const pend = populationCnjs(L.ctx).filter((x) => x.length === 20);
      await requestDataJud(id, "population", by, true);
      return { ok: true, mapping: mm.mapping, processColumn: mm.processColumn, headerRow: mm.headerRow, warnings: mm.warnings, rows: mm.records.length, params: mm.params, population: pend.length };
    }
    if (kind === "word-general" || kind === "word-closed") {
      if (!/\.docx$/i.test(file.name)) throw new Error("Envie o relatório em .docx.");
      const rep = await DOCX.parseReport(buf, kind === "word-general" ? "general" : "closed");
      if (!rep.records.length) throw new Error("Não encontrei casos no Word (tabelas com Case Name / Lawsuit number).");
      rep.records.forEach((r) => { r.scope = rep.scope; });
      const prefix = kind === "word-general" ? `wg-${rep.scope}` : "wc";
      const chunks = await putChunks(id, prefix, rep.records, 150000);
      const rawChunks = await putB64(id, prefix + "-raw", toB64(buf));
      const info = { name: file.name, at: nowIso(), by, scope: rep.scope, records: rep.records.length, withRevisions: rep.records.filter((r) => r.rev > 0).length, chunks, rawChunks };
      if (kind === "word-general") c.inputs.wordGeneral = [...(c.inputs.wordGeneral || []).filter((w) => w.scope !== rep.scope), info];
      else c.inputs.wordClosed = info;
      m.word = m.word.filter((w) => (kind === "word-general" ? !(w.kind === "general" && (w.scope || "Crop") === rep.scope) : w.kind !== "closed"));
      rep.records.forEach((r) => m.word.push(r));
      await saveCycle(c); invalidate(id);
      await trail(c, { source: "Upload", field: kind === "word-general" ? `Word General (${rep.scope})` : "Word Closed Cases", new: file.name, reason: `${rep.records.length} casos`, user: by });
      return { ok: true, info };
    }
    throw new Error("Tipo de arquivo não reconhecido.");
  }

  async function setParams(id, b) {
    const m = await load(id); const c = m.cycle;
    if (c.status === "CLOSED") throw new Error("Quarter fechado.");
    const old = Object.assign({}, c.params);
    for (const k of ["threshold", "fx", "materiality", "fxTol"]) if (b[k] !== undefined && b[k] !== "" && !isNaN(+b[k])) c.params[k] = +b[k];
    c.paramsLocked = true;
    await saveCycle(c); invalidate(id);
    await trail(c, { source: "Parâmetros", field: "Parâmetros do ciclo", old: JSON.stringify(old), new: JSON.stringify(c.params), user: b.user || me.name });
    return { params: c.params };
  }

  /* DataJud: o artefato não alcança a API do CNJ; a consulta é feita pelo Claude
     (ou importada a partir da exportação do datajud-search) e gravada aqui. */
  async function requestDataJud(id, scope, user, silent) {
    const L = await ctxOf(id);
    const c = L.m.cycle;
    let cnjs = scope === "all" ? L.ctx.excel.map((r) => r.cnj) : populationCnjs(L.ctx);
    if (scope === "missing") cnjs = cnjs.filter((x) => !(L.ctx.dj && L.ctx.dj[x]));
    cnjs = [...new Set(cnjs.filter((x) => x && x.length === 20))];
    const req = { cycle: id, scope, cnjs, count: cnjs.length, at: nowIso(), by: user || me.name, status: "pending" };
    await db.doc(`requests/datajud-${id}`).set(req);
    c.djRequest = { scope, count: cnjs.length, at: req.at, by: req.by, status: "pending" };
    await saveCycle(c);
    if (!silent) await trail(c, { source: "DataJud", reason: `Consulta solicitada (${scope}): ${cnjs.length} processos`, user: req.by });
    return { request: c.djRequest };
  }

  function normalizeDjInput(json, rowsXlsx) {
    // aceita: resposta bruta do DataJud, lista de respostas, resultado de lote do datajud-search, resumo do Litigation, ou a planilha exportada pelo datajud-search
    const results = {};
    const push = (src) => { if (!src || !src.numeroProcesso) return; const k = String(src.numeroProcesso).replace(/\D/g, ""); (results[k] = results[k] || []).push(DJ.summarize(src)); };
    if (rowsXlsx) {
      const H = rowsXlsx[0].map((h) => String(h).toLowerCase());
      const ix = (re) => H.findIndex((h) => re.test(h));
      const iN = ix(/n[uú]mero do processo/), iT = ix(/^tribunal/), iC = ix(/^classe/), iO = ix(/[óo]rg[aã]o/), iA = ix(/ajuizamento/), iS = ix(/^status/), iD = ix(/destaque/);
      const MAPC = { "senten": "Sentença", "acórd": "Acórdão", "acord": "Acórdão", "recurso": "Recurso", "trânsito": "Trânsito em julgado", "transito": "Trânsito em julgado" };
      const br = (s) => { const m = /(\d{2})\/(\d{2})\/(\d{4})/.exec(s || ""); return m ? `${m[3]}-${m[2]}-${m[1]}T12:00:00Z` : null; };
      for (const r of rowsXlsx.slice(1)) {
        const n = String(r[iN] || "").replace(/\D/g, "");
        if (!n || /não encontrado/i.test(String(r[iS] || ""))) continue;
        const mov = [];
        String(r[iD] || "").split("|").forEach((p) => { const [lab, d] = p.split(":"); const key = Object.keys(MAPC).find((k) => String(lab || "").toLowerCase().includes(k)); const dh = br(d); if (key && dh) mov.push({ dataHora: dh, nome: MAPC[key] }); });
        const st = /^(.*) em (\d{2}\/\d{2}\/\d{4})/.exec(String(r[iS] || ""));
        if (st) mov.push({ dataHora: br(st[2]), nome: st[1] });
        push({ numeroProcesso: n, tribunal: r[iT], grau: "—", classe: { nome: String(r[iC] || "").replace(/\s*\(\d+\)$/, "") }, orgaoJulgador: { nome: r[iO] }, dataAjuizamento: br(r[iA]) ? br(r[iA]).slice(0, 10).replace(/-/g, "") : "", movimentos: mov });
      }
      return { results, notFound: rowsXlsx.slice(1).filter((r) => /não encontrado/i.test(String(r[iS] || ""))).map((r) => String(r[iN] || "").replace(/\D/g, "")) };
    }
    const walk = (j) => {
      if (!j) return;
      if (Array.isArray(j)) return j.forEach(walk);
      if (j.hits && j.hits.hits) return j.hits.hits.forEach((h) => push(h._source));
      if (j.resultados) return j.resultados.forEach((p) => p.encontrado !== false && push({ numeroProcesso: p.numeroProcesso, tribunal: p.tribunal, grau: p.grau, classe: p.classe, orgaoJulgador: p.orgaoJulgador, dataAjuizamento: p.dataAjuizamento, movimentos: p.andamentos || p.movimentos }));
      if (j.results && typeof j.results === "object") return Object.entries(j.results).forEach(([k, v]) => { results[k] = v; });
      if (j._source) return push(j._source);
      if (j.numeroProcesso && (j.movimentos || j.andamentos)) return push(Object.assign({}, j, { movimentos: j.movimentos || j.andamentos }));
    };
    walk(json);
    return { results, notFound: (json && json.notFound) || [] };
  }

  async function saveDataJud(id, parsed, source, user) {
    const L = await ctxOf(id);
    const c = L.m.cycle;
    const merged = Object.assign({}, (L.m.dj && L.m.dj.results) || {}, parsed.results);
    const notFound = [...new Set([...(parsed.notFound || []), ...(((L.m.dj && L.m.dj.notFound) || []))])].filter((x) => !merged[x]);
    const chunks = await putChunks(id, "dj", Object.entries(merged).map(([k, v]) => ({ k, v })), 170000);
    const pop = populationCnjs(L.ctx);
    c.datajud = { at: nowIso(), source, chunks, queried: pop.length, found: pop.filter((x) => merged[x]).length, notFound: notFound.length, notFoundList: notFound.slice(0, 500), errors: 0, unroutable: 0 };
    if (c.djRequest) c.djRequest.status = "done";
    L.m.dj = { results: merged, notFound };
    await saveCycle(c); invalidate(id);
    await trail(c, { source: "DataJud", reason: `${source}: ${Object.keys(parsed.results).length} processos atualizados; ${notFound.length} não localizados`, user: user || me.name });
    return { datajud: c.datajud };
  }

  /* Processar: consulta o DataJud pelo conector local (host:datajud) em lotes */
  let mcpCap;
  async function processDataJud(id, user, onProgress = () => {}) {
    const L = await ctxOf(id);
    if (!L.m.cycle.inputs.excel) throw new Error("Suba a base Excel do quarter antes de processar.");
    const cnjs = [...new Set(populationCnjs(L.ctx).filter((x) => x && x.length === 20))];
    if (mcpCap === undefined) mcpCap = window.claude && window.claude.use ? await claude.use("mcp") : null;
    if (!mcpCap) { await requestDataJud(id, "population", user, true); const e = new Error("NO_CONNECTOR"); e.code = "NO_CONNECTOR"; throw e; }
    const acc = { results: {}, notFound: [], errors: [] };
    const size = 40;
    for (let i = 0; i < cnjs.length; i += size) {
      onProgress({ done: i, total: cnjs.length });
      let r;
      try { r = await mcpCap.callTool("host:datajud", "consultar_processos", { cnjs: cnjs.slice(i, i + size) }); }
      catch (e) {
        if (i === 0) { if (["server_not_connected", "not_in_manifest", "not_granted", "blocked_by_policy"].includes(e.code)) { await requestDataJud(id, "population", user, true); const x = new Error("NO_CONNECTOR"); x.code = "NO_CONNECTOR"; x.detail = e.code; throw x; } throw e; }
        acc.errors.push(e.message || e.code); continue;
      }
      const p = r.payload || {};
      Object.assign(acc.results, p.results || {});
      acc.notFound.push(...(p.notFound || []));
      (p.errors || []).forEach((x) => acc.errors.push(x.error || String(x)));
    }
    onProgress({ done: cnjs.length, total: cnjs.length });
    const out = await saveDataJud(id, acc, `DataJud (conector local${acc.errors.length ? `, ${acc.errors.length} lotes com erro` : ""})`, user);
    return Object.assign({ queried: cnjs.length, errors: acc.errors.length }, out);
  }

  async function importDataJud(id, file, user) {
    const buf = await file.arrayBuffer();
    let parsed;
    if (/\.xlsx$/i.test(file.name)) {
      const wb = XLSX.read(buf, { type: "array" });
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: "" });
      parsed = normalizeDjInput(null, rows);
    } else parsed = normalizeDjInput(JSON.parse(new TextDecoder().decode(buf)));
    if (!Object.keys(parsed.results).length) throw new Error("Não reconheci processos do DataJud nesse arquivo.");
    return saveDataJud(id, parsed, `Importação (${file.name})`, user);
  }

  async function caseDetail(id, cnj) {
    const L = await ctxOf(id);
    const issues = withDecisions(L.m, L.issues).filter((i) => i.cnj === cnj);
    const inst = (L.ctx.dj && L.ctx.dj[cnj]) || null;
    const pop = population(L);
    const idx = pop.findIndex((x) => x.cnj === cnj);
    const t = await readTrail(id);
    const sm = djSummary(inst);
    return {
      cnj, cnjFmt: fmtCnj(cnj), excel: L.ctx.excel.filter((r) => r.cnj === cnj), word: L.ctx.word.filter((w) => w.cnj === cnj),
      baseline: L.ctx.baseline ? L.ctx.baseline[cnj] || null : null, baselineFrom: L.baselineFrom,
      datajud: inst, djSummary: sm, djStage: inst ? STAGE_LABEL[djStage(sm)] : null,
      djNotFound: !!(L.djMeta && (L.djMeta.notFound || []).includes(cnj)),
      issues, trail: t.filter((x) => x.cnj === cnj),
      prev: idx > 0 ? pop[idx - 1].cnj : null, next: idx >= 0 && idx < pop.length - 1 ? pop[idx + 1].cnj : null, params: L.ctx.params,
    };
  }

  async function decide(id, b) {
    const L = await ctxOf(id);
    const c = L.m.cycle;
    if (c.status === "CLOSED") throw new Error("Quarter fechado: decisões congeladas.");
    const i = L.issues.find((x) => x.key === b.key);
    if (!i) throw new Error("Inconsistência não encontrada (a base pode ter sido reimportada).");
    const user = b.user || me.name || "usuário";
    const k = safeKey(i.key);
    if (b.decision === "REOPEN") {
      const oldD = L.m.decisions[k];
      await db.doc(`cycles/${id}/decisions/${k}`).delete();
      delete L.m.decisions[k];
      await trail(c, { cnj: i.cnj, rule: i.rule, field: i.field, old: oldD ? `${oldD.decision}${oldD.value ? " = " + oldD.value : ""}` : "", new: "Reaberta", source: "Validação humana", reason: "Decisão reaberta", decision: "REOPEN", user });
      return { ok: true };
    }
    if (!DECISIONS[b.decision]) throw new Error("Decisão inválida.");
    if (!RULE[i.rule].acoes.includes(b.decision)) throw new Error(`A regra ${i.rule} não admite "${DECISIONS[b.decision]}".`);
    if (b.decision === "MANUAL" && !String(b.value || "").trim()) throw new Error("Informe o valor corrigido.");
    const just = String(b.justification || "").trim();
    if ((b.decision === "KEEP" || b.decision === "JUSTIFIED" || i.sev === "C") && just.length < 5) throw new Error("Justificativa obrigatória para esta decisão.");
    const d = { key: i.key, decision: b.decision, value: b.decision === "MANUAL" ? String(b.value).trim() : b.decision === "ACCEPT" ? i.suggested || i.datajud || null : null, justification: just, by: user, byId: me.id || null, at: nowIso(), rule: i.rule, cnj: i.cnj, field: i.field };
    await db.doc(`cycles/${id}/decisions/${k}`).set(d);
    L.m.decisions[k] = d;
    await trail(c, {
      cnj: i.cnj, rule: i.rule, field: i.field,
      old: [i.excel && `Excel: ${i.excel}`, i.word && `Word: ${i.word}`, i.prev && `Anterior: ${i.prev}`].filter(Boolean).join(" | "),
      new: d.value || (b.decision === "KEEP" ? "Mantido o dado interno" : b.decision === "JUSTIFIED" ? "Divergência mantida" : ""),
      source: b.decision === "ACCEPT" ? (i.datajud ? "DataJud" : "Sugestão do sistema") : b.decision === "MANUAL" ? "Correção manual" : "Base interna",

  }

  /* ---------- saídas ---------- */
  const WORD_FIELD = { "Case Stage": "stage", "Case Stage × Status": "stage", "Loss Reserve": "reserve", "Financial Relief USD": "reliefUSD", "Financial Relief BRL": "reliefBRL", "Date of First Court Filing": "filing", "Estimated Date of Case Completion": "estCompletion", "Lawsuit Number": "lawsuit" };
  function overrides(m, issues) {
    const out = {};
    for (const i of issues) {
      const d = m.decisions[safeKey(i.key)];
      if (!d) continue;
      let v = d.decision === "MANUAL" ? d.value : d.decision === "ACCEPT" ? i.suggested || null : null;
      if (v === null || v === undefined || v === "") continue;
      (out[i.cnj] = out[i.cnj] || []).push({ field: i.field, value: v, rule: i.rule, decision: d.decision });
    }
    return out;
  }
  function wordChanges(L, issues) {
    const { ctx, m } = L;
    const q = quarterInfo(ctx.cycleId);
    const exBy = {}; ctx.excel.forEach((r) => { if (!exBy[r.cnj]) exBy[r.cnj] = r; });
    const ov = overrides(m, issues);
    const ch = {};
    const keepRules = { stage: ["AUD-006", "AUD-007", "AUD-008", "AUD-022"], filing: ["AUD-005"], reliefBRL: ["AUD-015"], reliefUSD: ["AUD-015"], reserve: ["AUD-012", "AUD-013"] };
    for (const w of ctx.word.filter((x) => x.kind === "general" && x.cnj)) {
      const r = exBy[w.cnj];
      if (!r) continue;
      const set = {};
      const st = stageFromExcel(r.posicao);
      if (st && stageFromWord(w.stage) !== st) set.stage = STAGE_LABEL[st];
      if (r.valorCur && Math.abs((w.reliefBRLn || 0) - r.valorCur) > 0.01) set.reliefBRL = `BRL ${fmtBR(r.valorCur)}`;
      const usd = r.valorCur ? r.valorCur / ctx.params.fx : null;
      if (usd && Math.abs((w.reliefUSDn || 0) - usd) / usd > 0.001) set.reliefUSD = `USD ${fmtBR(usd)}`;
      if (r.prob && RISK_EN[r.prob] && !new RegExp(RISK_EN[r.prob], "i").test(w.risk || "")) set.risk = RISK_EN[r.prob];
      if (r.prob === "Provável" && r.vProv > 0 && Math.abs((w.reserveN || 0) - r.vProv) > 0.01) set.reserve = `BRL ${fmtBR(r.vProv)}`;
      const y = w.cnj.length === 20 ? w.cnj.slice(9, 13) : null;
      if (y && !(w.filing || "").includes(y)) set.filing = y;
      if (q) { const lu = `${ORD[q.q - 1]} Quarter ${q.y}`; if ((w.lastUpdate || "").trim() !== lu) set.lastUpdate = lu; }
      for (const [k, rules] of Object.entries(keepRules)) {
        if (set[k] === undefined) continue;
        if (issues.some((i) => i.cnj === w.cnj && rules.includes(i.rule) && m.decisions[safeKey(i.key)] && ["KEEP", "JUSTIFIED"].includes(m.decisions[safeKey(i.key)].decision))) delete set[k];
      }
      for (const o of ov[w.cnj] || []) { const k = WORD_FIELD[o.field]; if (k) set[k] = o.value; }
      // andamentos relevantes do DataJud entram no Status Update como inserção rastreada
      const st21 = issues.find((i) => i.cnj === w.cnj && i.rule === "AUD-021");
      if (st21) {
        const d = m.decisions[safeKey(st21.key)];
        if (!d || !["KEEP", "JUSTIFIED"].includes(d.decision)) {
          const txt = d && d.decision === "MANUAL" ? d.value : st21.suggested;
          if (txt) set.status = { append: txt };
        }
      }
      if (Object.keys(set).length) ch[w.cnj] = set;
    }
    return ch;
  }
  const ISSUE_HDR = ["Lawsuit Number", "Plaintiff", "Validation ID", "Regra", "Severity", "Bloqueia fechamento", "Field", "Previous Quarter", "Current Excel", "Word", "DataJud", "Latest Proceeding", "Reason", "Suggested Action", "Decision", "Valor corrigido", "Justification", "Validated By", "Validated At", "Status"];
  const TRAIL_HDR = ["Timestamp", "Quarter", "Lawsuit Number", "Validation ID", "Field", "Old Value", "New Value", "Source", "Reason", "Decision", "Justification", "User"];
  const issueRow = (m, i) => { const d = m.decisions[safeKey(i.key)]; return [fmtCnj(i.cnj), i.plaintiff || "", i.rule, RULE[i.rule].name, { C: "Critical", R: "Relevant", Q: "Data Quality" }[i.sev], i.block ? "Sim" : "Não", i.field || "", i.prev || "", i.excel || "", i.word || "", i.datajud || "", i.latest || "", i.reason || "", i.action || "", d ? DECISIONS[d.decision] : "", d ? d.value || "" : "", d ? d.justification || "" : "", d ? d.by : "", d ? d.at : "", d ? "Validated" : "Open"]; };
  const trailRow = (t) => [t.ts, t.quarter, t.cnj ? fmtCnj(t.cnj) : "", t.rule || "", t.field || "", t.old || "", t.new || "", t.source || "", t.reason || "", t.decision || "", t.justification || "", t.user || ""];
  const xlsxOf = (name, aoa, widths) => { const wb = XLSX.utils.book_new(); const ws = XLSX.utils.aoa_to_sheet(aoa); if (widths) ws["!cols"] = widths.map((w) => ({ wch: w })); XLSX.utils.book_append_sheet(wb, ws, name.slice(0, 31)); return new Uint8Array(XLSX.write(wb, { type: "array", bookType: "xlsx", compression: true })); };

  /* Decisões que alteram células do Excel (regra → coluna do modelo) */
  const STAGE_PT = { "Completed": "Arquivado", "Enforcement": "Execução", "On Appeal": "2ª Instância", "Action Pending in Court": "1ª Instância", "Negotiated Settlement": "Acordo" };
  const RISK_PT = { probable: "Provável", provavel: "Provável", possible: "Possível", possivel: "Possível", remote: "Remota", remota: "Remota" };
  const brNum = (v) => { if (typeof v === "number") return v; const t = String(v || "").replace(/[^\d,.\-]/g, ""); if (!t) return null; const n = /,\d{1,2}$/.test(t) ? +t.replace(/\./g, "").replace(",", ".") : +t.replace(/,/g, ""); return isNaN(n) ? null : n; };
  const plain = (v) => String(v || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
  function excelEdits(L, issues) {
    const m = L.m, out = [];
    const exBy = {}; L.ctx.excel.forEach((r) => { if (!exBy[r.cnj]) exBy[r.cnj] = r; });
    for (const i of issues) {
      const d = m.decisions[safeKey(i.key)];
      if (!d || !["MANUAL", "ACCEPT"].includes(d.decision)) continue;
      const v = d.decision === "MANUAL" ? d.value : i.suggested;
      const r = i.ref && i.ref.startsWith("ex") ? L.ctx.excel[+i.ref.slice(2)] : exBy[i.cnj];
      if (!r || v === null || v === undefined || v === "") continue;
      const push = (key, val) => out.push({ row: r._row, cnj: i.cnj, key, old: r[key], val, rule: i.rule, decision: d.decision, by: d.by, at: d.at, just: d.justification });
      const sfx = i.suffix || "";
      switch (i.rule) {
        case "AUD-001": if (i.ref && i.ref.startsWith("ex")) push("cnj", String(v)); break;
        case "AUD-005": if (sfx === "x") push("distrib", String(v)); break;
        case "AUD-006": push("posicao", STAGE_PT[v] || v); break;
        case "AUD-009": case "AUD-010": case "AUD-011": case "AUD-012": case "AUD-013":
          if (i.rule === "AUD-012" && sfx === "w") break;
          if (brNum(v) !== null) push("vProv", brNum(v)); else if (RISK_PT[plain(v)]) push("prob", RISK_PT[plain(v)]);
          break;
        case "AUD-015": if (sfx === "x" && brNum(v) !== null) push("usdCur", brNum(v)); break;
        case "AUD-016": if (sfx === "f") push("acimaCur", /^s|^y|sim|yes/i.test(String(v)) ? "Sim" : "Não"); else if (d.decision === "ACCEPT") push("repCur", i.tag === "OUT" ? "Não" : "Sim"); break;
        case "AUD-017": if (d.decision === "ACCEPT") push("repCur", "Sim"); break;
        case "AUD-019": if (brNum(v) !== null) { push("valorCur", brNum(v)); push("usdCur", brNum(v) / L.ctx.params.fx); } break;
      }
    }
    return out;
  }

  async function validatedXlsx(L, issues) {
    const c = L.m.cycle;
    const b64 = await getB64(c.id, "excel-raw", c.inputs.excel.rawChunks);
    const wb = XLSX.read(fromB64(b64), { type: "array" });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: "" });
    const hdr = c.inputs.excel.headerRow - 1;
    const colOf = {}; (c.inputs.excel.mapping || []).forEach((mp) => { if (mp.col) colOf[mp.key] = XLSX.utils.decode_col(mp.col); });
    // 1) aplica as decisões nas células
    const edits = excelEdits(L, issues);
    const applied = [];
    for (const e of edits) {
      const col = colOf[e.key];
      if (col === undefined) continue;
      const addr = XLSX.utils.encode_cell({ r: e.row - 1, c: col });
      const before = ws[addr] ? ws[addr].v : "";
      ws[addr] = typeof e.val === "number" ? { t: "n", v: e.val } : { t: "s", v: String(e.val) };
      applied.push(Object.assign({ addr, before }, e));
    }
    // 2) colunas de auditoria ao final
    const byRow = {}; L.ctx.excel.forEach((r) => { byRow[r._row] = r; });
    const iss = {}; issues.forEach((i) => { (iss[i.cnj] = iss[i.cnj] || []).push(i); });
    const chByRow = {}; applied.forEach((a) => { (chByRow[a.row] = chByRow[a.row] || []).push(`${(c.inputs.excel.mapping.find((x) => x.key === a.key) || {}).header || a.key}: ${a.before === "" ? "(vazio)" : a.before} → ${a.val}`); });
    const width = rows[hdr].length;
    const add = [["AUDIT_STATUS", "AUDIT_ISSUES", "AUDIT_DECISIONS", "VALIDATED_CHANGES"]];
    for (let i = hdr + 1; i < rows.length; i++) {
      const r = byRow[i + 1];
      if (!r) { add.push(["", "", "", ""]); continue; }
      const li = iss[r.cnj] || [], open = li.filter((x) => !L.m.decisions[safeKey(x.key)]);
      add.push([li.length ? (open.length ? `OPEN (${open.length})` : "VALIDATED") : "OK", li.map((x) => x.rule).join(", "), li.filter((x) => L.m.decisions[safeKey(x.key)]).map((x) => `${x.rule}: ${L.m.decisions[safeKey(x.key)].decision}`).join("; "), (chByRow[i + 1] || []).join("; ")]);
    }
    XLSX.utils.sheet_add_aoa(ws, add, { origin: { r: hdr, c: width } });
    // 3) aba de log: antes/depois de cada célula alterada
    const log = [["Linha", "Célula", "Lawsuit Number", "Coluna", "Valor original", "Valor validado", "Regra", "Decisão", "Justificativa", "Validado por", "Validado em"]];
    applied.forEach((a) => log.push([a.row, a.addr, fmtCnj(a.cnj), (c.inputs.excel.mapping.find((x) => x.key === a.key) || {}).header || a.key, a.before, a.val, a.rule, DECISIONS[a.decision], a.just || "", a.by || "", a.at || ""]));
    const wl = XLSX.utils.aoa_to_sheet(log); wl["!cols"] = [8, 8, 26, 30, 22, 22, 10, 22, 40, 20, 22].map((w) => ({ wch: w }));
    XLSX.utils.book_append_sheet(wb, wl, "VALIDATION_LOG");
    return new Uint8Array(XLSX.write(wb, { type: "array", bookType: "xlsx", compression: true }));
  }

  async function exportFile(id, kind) {
    const L = await ctxOf(id);
    const c = L.m.cycle;
    const issues = withDecisions(L.m, L.issues);
    if (c.status !== "CLOSED") throw new Error("A exportação é liberada depois do CLOSE QUARTER.");
    const tag = id.replace("-", "_"), draft = c.status === "CLOSED" ? "" : "_DRAFT";

    if (kind === "audit") return { filename: `Litigation_${tag}_AUDIT_REPORT${draft}.xlsx`, data: xlsxOf("Audit", [ISSUE_HDR, ...issues.map((i) => issueRow(L.m, i))], [26, 28, 10, 30, 12, 10, 22, 24, 30, 36, 30, 36, 48, 32, 22, 20, 36, 18, 20, 10]) };

  }

  async function download(id, kind) {

  async function close(id, b) {

(() => {

/* Upload único: reconhece cada arquivo e manda para o lugar certo */
async function sniffXlsx(file) {
  const wb = XLSX.read(await file.arrayBuffer(), { type: "array", sheetRows: 15 });
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: "" });
  const head = rows.slice(0, 3).flat().map((x) => String(x).toLowerCase());
  const isDj = head.some((h) => /status \(último andamento\)|andamentos em destaque/.test(h));
  let cycleId = null;
  if (!isDj) { try { cycleId = TPL.mapModel(rows).cycleId; } catch (e) {} }
  return { isDj, cycleId };
}
async function uploadAny(files) {
  if (!files.length) return;
  if (!SVC.hasDb()) { toast("Abra o artefato pelo link no Claude para subir arquivos.", 6000); return; }
  const plan = [];
  for (const f of files) {
    if (/\.json$/i.test(f.name)) plan.push({ f, kind: "dj", order: 3 });
    else if (/\.docx$/i.test(f.name)) plan.push({ f, kind: /closed/i.test(f.name) ? "word-closed" : "word-general", order: 2 });
    else if (/\.xlsx$/i.test(f.name)) { const s = await sniffXlsx(f); plan.push(s.isDj ? { f, kind: "dj", order: 3 } : { f, kind: "excel", order: 1, cycleId: s.cycleId }); }
    else toast(`${f.name}: formato não aceito (use .xlsx, .docx ou .json).`, 5000);
  }
  plan.sort((a, b) => a.order - b.order);
  try {
    const ex = plan.find((p) => p.kind === "excel");
    // sem quarter aberto, cria pelo quarter citado no cabeçalho da planilha
    if (!S.cid || (ex && ex.cycleId && ex.cycleId !== S.cid && !S.cycles.some((c) => c.id === ex.cycleId))) {
      const id = (ex && ex.cycleId) || null;
      if (!id) { toast("Suba primeiro a base Excel: o quarter é identificado pelo cabeçalho dela.", 6000); return; }
      if (!S.cycles.some((c) => c.id === id)) { await SVC.createCycle({ id, user: user() }); toast(`${id} criado a partir da planilha.`); }
      await loadCycles(); await loadCycle(id);
    } else if (ex && ex.cycleId && ex.cycleId !== S.cid && S.cycles.some((c) => c.id === ex.cycleId)) {
      await loadCycle(ex.cycleId);
    }
    for (const p of plan) {
      toast(`Processando ${p.f.name}…`, 60000);
      if (p.kind === "dj") { const r = await SVC.importDataJud(S.cid, p.f, user()); toast(`DataJud: ${r.datajud.found} de ${r.datajud.queried} processos com retorno.`, 4000); }
      else { const r = await SVC.upload(S.cid, p.kind, p.f, user()); toast(p.kind === "excel" ? `${r.rows} processos · coluna do processo ${r.processColumn.col}` : `${p.f.name}: ${r.info.records} casos`, 4000); }
    }
    await refresh();
    toast(`${plan.length} arquivo(s) processado(s).`, 4000);
    go("home");
  } catch (e) { toast(e.message || String(e), 7000); }
}

function nextQuarterId() {
  const ids = S.cycles.map((c) => c.id);
  const d = new Date(); let q = Math.floor(d.getMonth() / 3) + 1, y = d.getFullYear();
  if (ids.length) { const m = /Q(\d)-(\d{4})/.exec(ids[0]); q = +m[1] + 1; y = +m[2]; if (q > 4) { q = 1; y++; } }
  return `Q${q}-${y}`;
}

function procHint() {
  const c = S.cycle; if (!c) return "";
  if (c.cycle.status === "CLOSED") return `<div class="notice" style="background:var(--ok-soft)">Quarter fechado. As saídas estão na aba Quarter Close.</div>`;
  if (!c.inputs.excel) return `<p class="muted">Suba a base Excel para liberar o Processar.</p>`;
  if (!c.cycle.datajud) return `<p class="muted">Processar consulta o DataJud para os ${S.audit ? S.audit.cases.length : ""} processos da população reportável, pelo seu computador, e recalcula as 26 regras.</p>`;
  return `<p class="muted">Último processamento: ${fmtTs(c.cycle.datajud.at)} (${esc(c.cycle.datajud.source || "")}). Processar de novo atualiza os andamentos.</p>`;
}
async function processar() {
  const box = $("#procbox"), btn = $("#bproc");
  if (btn) btn.disabled = true;
  box.innerHTML = `<div class="row"><span class="pill dj"><span class="dot"></span>Consultando o DataJud…</span><span class="bar" style="width:220px;display:inline-flex"><i id="pbar" style="width:3%;background:var(--dj)"></i></span><span id="ptxt" class="muted"></span></div>`;
  try {
    const r = await SVC.processDataJud(S.cid, user(), (p) => { const b = $("#pbar"), t = $("#ptxt"); if (b) b.style.width = Math.max(3, Math.round((p.done / p.total) * 100)) + "%"; if (t) t.textContent = `${p.done} de ${p.total} processos`; });
    await refresh();
    toast(`Processado: ${r.datajud.found} de ${r.queried} processos com retorno do DataJud${r.errors ? ` · ${r.errors} lotes com erro` : ""}.`, 6000);
    go("inc");
  } catch (e) {
    if (e.code === "NO_CONNECTOR") {
      await refresh();
      $("#procbox").innerHTML = `<div class="notice warn" style="flex-direction:column;align-items:stretch;gap:8px"><b>${window.__LOCAL__ ? "O DataJud não respondeu." : "O DataJud automático não roda dentro do Claude."}</b>
        <span>${window.__LOCAL__ ? "Verifique a conexão com a internet e tente de novo." : "Dentro do Claude o navegador não alcança a API do CNJ. Para o Processar automático, abra esta mesma tela no seu computador com o <b>iniciar-litigation.bat</b> (pasta datajud-search)."}</span>
        <span>Enquanto isso, a auditoria já está calculada sem DataJud. Você também pode pedir no chat: "atualiza o DataJud do ${esc(S.cid)}", ou importar o retorno exportado pelo datajud-search:</span>
        <div><label class="btn sm" for="fx-dj">Importar retorno do DataJud</label><input type="file" id="fx-dj" accept=".json,.xlsx" hidden></div></div>`;
      bindDjFallback();
    } else { toast(e.message || String(e), 7000); $("#procbox").innerHTML = procHint(); }
  } finally { const b = $("#bproc"); if (b) b.disabled = false; }
}
function bindDjFallback() {
  $("#fx-dj")?.addEventListener("change", async (e) => { const f = e.target.files[0]; if (!f) return; try { toast(`Lendo ${f.name}…`, 20000); const r = await SVC.importDataJud(S.cid, f, user()); toast(`DataJud: ${r.datajud.found} de ${r.datajud.queried} processos com retorno.`, 5000); await refresh(); } catch (err) { toast(err.message, 6000); } });
}

const REL_LABEL = { transito: "Trânsito em julgado", baixa: "Baixa/Arquivamento", acordo: "Acordo", pagamento: "Pagamento", calculos: "Cálculos/Liquidação", execucao: "Execução", acordao: "Acórdão", sentenca: "Sentença/Julgamento", recurso: "Recurso" };

function bindDecision(form) {

        ${chk(migr.every((i) => i.status === "Validated"), true, "Migrações GENERAL → CLOSED decididas", `${migr.length} candidatos · aceitos vão para a lista de Closed do próximo ciclo`)}
      </div></div>
      <div class="panel"><div class="hd"><h3>Exportar</h3><span class="spacer"></span>${closed ? '<span class="pill ok">liberado</span>' : '<span class="muted" style="font-size:12px">liberado depois do CLOSE QUARTER</span>'}</div><div class="bd" style="display:flex;flex-direction:column;gap:10px">
        <div class="row"><button class="btn" data-x="validated" ${closed ? "" : "disabled"}>Base validada (.xlsx)</button><span class="muted" style="font-size:12px">layout do modelo com as células ajustadas pelas decisões + aba VALIDATION_LOG (antes/depois)</span></div>
        <div class="row"><button class="btn" data-x="word" ${closed && (I.wordGeneral || []).length ? "" : "disabled"}>Word com Track Changes (.docx)</button><span class="muted" style="font-size:12px">Stage, valores, risco, provisão, filing, last update e andamentos relevantes do DataJud no Status Update</span></div>
        <div class="row"><button class="btn" data-x="word-changes" ${closed ? "" : "disabled"}>Lista de alterações do Word (.xlsx)</button></div>
        <div class="row"><button class="btn" data-x="audit" ${closed ? "" : "disabled"}>Relatório de auditoria (.xlsx)</button></div>
        <div class="row"><button class="btn" data-x="trail" ${closed ? "" : "disabled"}>Audit trail (.xlsx)</button></div>
        <hr style="border:0;border-top:1px solid var(--line-2);width:100%">
        ${closed ? "" : `<div id="closebox"><button class="btn primary" id="bclose" ${st.blocking ? "disabled" : ""}>CLOSE QUARTER</button> ${st.blocking ? `<span class="muted" style="font-size:12px">Libera quando as ${st.blocking} bloqueadoras forem resolvidas.</span>` : ""}</div>`}
      </div></div>
    </div>
    <div class="notice"><div>O texto já existente do Status Update é preservado: os andamentos relevantes do DataJud entram ao final como inserção rastreada (AUD-021). Aceite o texto sugerido, edite em Manual correction ou mantenha sem inserção com Keep/Justified.</div></div>`;
  document.querySelectorAll("[data-x]").forEach((b) => b.addEventListener("click", () => download(b.dataset.x)));
  $("#bclose")?.addEventListener("click", () => {
    $("#closebox").innerHTML = `<div class="notice crit" style="flex-direction:column"><b>Confirmar fechamento de ${S.cid}?</b><span>A base e as decisões ficam congeladas e passam a ser baseline de ${nextOf(S.cid)}.</span><div class="row"><button class="btn primary" id="bconf">Fechar ${S.cid}</button><button class="btn" id="bcanc">Cancelar</button></div></div>`;
    $("#bcanc").addEventListener("click", viewClose);
    $("#bconf").addEventListener("click", async () => { try { await SVC.close(S.cid, withUser()); toast(`${S.cid} fechado.`, 5000); await refresh(); } catch (e) { toast(e.message, 6000); } });
  });
}
const nextOf = (id) => { const m = /Q(\d)-(\d{4})/.exec(id); let q = +m[1] + 1, y = +m[2]; if (q > 4) { q = 1; y++; } return `Q${q}-${y}`; };

async function download(kind) {
  try {
    toast("Gerando arquivo…", 20000);
    const r = await SVC.download(S.cid, kind);
    toast(r.status === "declined" ? "Download cancelado." : `${r.filename} pronto.`);
  } catch (e) { toast(e.code === "declined" ? "Download cancelado." : e.message || String(e), 6000); }
}

boot().catch((e) => { $("#page").innerHTML = `<div class="notice crit">Não consegui carregar: ${esc(e.message)}</div>`; });

})();
</script>
</body>
</html>
